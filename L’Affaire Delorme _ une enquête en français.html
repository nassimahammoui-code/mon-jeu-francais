<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’Affaire Delorme : une enquête en français</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#000;--mut:#3a3740;--ac:#a50e1a;--on:#fff;--ok:#146c33;--ko:#a84a00;--line:#b9b4ac;--soft:#ebeae4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d10;--card:#18181c;--ink:#f1eeea;--mut:#a29da8;--ac:#ff4655;--on:#0d0d10;--ok:#5de08a;--ko:#ffb454;--line:#2c2c33;--soft:#222228;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d10;--card:#18181c;--ink:#f1eeea;--mut:#a29da8;--ac:#ff4655;--on:#0d0d10;--ok:#5de08a;--ko:#ffb454;--line:#2c2c33;--soft:#222228;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs,20px)/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--card);color:var(--ink);border-bottom:4px solid var(--ac)}
.logo{font:italic 700 19px Georgia,"Times New Roman",serif;letter-spacing:.3px}
.pv{font:700 15px system-ui;border:2px solid var(--ink);border-radius:99px;padding:3px 12px}.hc{display:flex;gap:6px;align-items:center}.hc button{min-height:40px;padding:2px 11px;font-size:17px}
main{max-width:660px;margin:0 auto;padding:16px}
h1,h2{font:italic 700 clamp(28px,7vw,40px)/1.1 Georgia,"Times New Roman",serif;margin:8px 0 10px}h2{font-size:27px}
p{margin:8px 0}.mut{color:var(--mut);font-size:.85em}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:9px 15px;min-height:46px;font-weight:700}
button:hover{background:var(--soft)}button:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on)}button:disabled{opacity:.55;cursor:default}
button.good{background:var(--ok);border-color:var(--ok);color:#0d0d10;opacity:1}
.steps{display:flex;gap:6px;margin:4px 0 12px}.steps i{flex:1;height:8px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--ac)}.steps i.ok{background:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0}
.story{border-left:5px solid var(--ac);font:italic 1em/1.6 Georgia,"Times New Roman",serif}
.fiche{border-top:4px solid var(--ink)}
.qq{font:700 1.15em/1.35 Georgia,serif;margin:8px 0}
.cx{display:inline-block;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 10px;font-size:14px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.o{flex-direction:column}.o button{text-align:left;font-size:1em;width:100%}
.fb{margin-top:10px}.ok{color:var(--ok);font-weight:800}.ko{color:var(--ko);font-weight:800}
.w{cursor:pointer;border-radius:3px}.w:hover{background:var(--soft)}
.found{background:var(--ok);color:#0d0d10;padding:1px 4px;border-radius:3px}.found small{display:block;font-size:13px}
.miss{background:var(--ko);color:#0d0d10;border-radius:3px}
.txt{line-height:2.4;font-size:1em}.txt select{font:inherit;border:2px solid var(--line);border-radius:6px;padding:2px;background:var(--bg);color:var(--ink)}.txt .g{border-color:var(--ok)}.txt .r{border-color:var(--ko)}
table{border-collapse:collapse;width:100%;font-size:.85em}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.tw{overflow-x:auto}
.sent{font:italic 700 1.1em/1.4 Georgia,serif}audio{width:100%;margin-top:8px}
.dots{display:flex;gap:4px;margin-bottom:6px}.dots i{flex:1;height:5px;background:var(--line)}.dots i.on{background:var(--ac)}
li{margin:5px 0}
details{border:1px solid var(--line);border-radius:6px;padding:6px 12px;margin:8px 0}summary{cursor:pointer;font-weight:700;min-height:32px}
label.ck{display:flex;gap:10px;align-items:center;min-height:40px}label.ck input{width:20px;height:20px}
.gen select{font:inherit;border:2px solid var(--ink);border-radius:6px;padding:8px;background:var(--bg);color:var(--ink);min-height:44px}
.steps button{flex:1;min-height:42px;padding:4px;font-size:16px}.steps button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}.steps button.ok{background:var(--ink);color:var(--bg)}
</style></head><body>
<header><span class="logo">L’Affaire Delorme</span><span class="hc"><button id="fm" aria-label="Réduire le texte">A−</button><button id="fp" aria-label="Agrandir le texte">A+</button><button id="th" aria-label="Changer le thème">🌙</button><span class="pv">🔎 <b id="pts">0</b></span></span></header>
<main id="v"></main>
<script>
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
(()=>{const r=document.documentElement;let fs=20,th='light';try{fs=+localStorage.getItem('fs')||20;th=localStorage.getItem('th')||'light'}catch(e){}
const sv=()=>{try{localStorage.setItem('fs',fs);localStorage.setItem('th',th)}catch(e){}};
const ap=()=>{r.style.setProperty('--fs',fs+'px');r.dataset.theme=th;$('#th').textContent=th=='light'?'🌙':'☀️'};
$('#fm').onclick=()=>{fs=Math.max(16,fs-2);ap();sv()};$('#fp').onclick=()=>{fs=Math.min(32,fs+2);ap();sv()};$('#th').onclick=()=>{th=th=='light'?'dark':'light';ap();sv()};ap()})();
let pts=0,cur=0;const ok=[],miss=[];const add=n=>{pts+=n;$('#pts').textContent=pts};
const spk=(t,r)=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=r||.9;const v=(speechSynthesis.getVoices()||[]).find(x=>x.lang&&x.lang.startsWith('fr'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}};
const PR=["Exact.","Bien vu.","Preuve validée.","Solide.","Bonne déduction."];const pr=()=>PR[Math.floor(Math.random()*PR.length)];
const tb=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* Fiches (coûtent 1 preuve, une fois par pièce) */
const F=[
`<b>Les paires qui piègent l’écrit</b>${tb(['Paire','Test rapide'],[['a / à','« a » = avait (verbe avoir)'],['ou / où','« ou » = ou bien · « où » = lieu'],['son / sont','« son » = mon · « sont » = étaient'],['ce / se','« se » = me/te : il <b>se</b> cache'],['qu’elle / quelle','« qu’elle » = que + elle · « quelle » = quelle heure ?'],['plus tôt / plutôt','« plus tôt » ≠ plus tard · « plutôt » = de préférence'],['s’en / sans / cent','« s’en » = se + en : il s’en va']])}`,
`<b>Inversion avancée</b><ul><li>Sujet = nom : on le garde <b>et</b> on ajoute un pronom : « Pourquoi <i>Madame Delorme</i> est-<b>elle</b> partie ? »</li><li>Préposition + qui/quoi en tête : « <b>À qui</b> avez-vous parlé ? »</li><li>Négation : « <b>N’</b>avez-vous <b>rien</b> remarqué ? »</li><li>Poli : « <b>Auriez-vous</b> l’obligeance de… »</li><li>Indirect : <b>pas</b> d’inversion : « Dites-moi ce que vous avez vu. »</li><li>🇪🇸 ¿Cuánto tiempo lleva…? → « <b>Depuis combien de temps</b> travaillez-vous ici ? »</li></ul>`,
`<b>Exceptions célèbres</b>${tb(['Mot','Se dit'],[['femme','« fam »'],['monsieur','« meu-sieu »'],['août','« ou »'],['oignon','« o-gnon »'],['sept','« sèt »'],['second','« se-gon »'],['fils','« fiss »'],['poêle','« poual »'],['sceptique','« sèp-tik »'],['asthme','« asm »'],['plomb','« plon »'],['paon','« pan »'],['faisons','« feu-zon »'],['écureuil','« é-ku-reuy »']])}<p>Verbes : « ils parlent » → <b>-ent muet</b>. Adverbes : « souvent » → <b>-ent = an</b>.</p>`,
`<b>Avant de parler : trois réflexes</b><ul><li>L’<b>accent</b> tombe à la fin du groupe de mots.</li><li>La <b>mélodie</b> monte pour une question oui/non, descend avec un mot interrogatif.</li><li>Les <b>sons à surveiller</b> pour toi : v/b, ui/oi, s + consonne sans « e » devant.</li></ul>`,
`<b>Rappels</b><ul><li>cesser <b>de</b> · avoir besoin <b>de</b> · décider <b>de</b> · finir <b>par</b></li><li>« <b>Ce</b> qui m’a frappé » (ce qui/ce que)</li><li>son/sont · a-t-il (le -t-)</li></ul>`];

/* Pièce 1 : notes du gardien */
const E=(a,b,w)=>[a,b,w];
const D=["Hier soir, j’ai entendu un bruit ",E("ou premier étage","au premier étage","au = à + le. « Ou » = ou bien."),". ",E("Sont fils","Son fils","« Son fils » = son = à lui. « Sont » est le verbe être."),
" m’a demandé ",E("si c’étais","si c’était","Imparfait, 3e personne : -ait."),
" le facteur. Le voleur ",E("ce cache","se cache","« Se » est le pronom de « se cacher »."),
" derrière le rideau, j’en suis sûr. J’ai cru ",E("quelle était","qu’elle était","que + elle = qu’elle."),
" partie, mais ",E("elle à","elle a","« a » = verbe avoir, sans accent."),
" dû revenir ",E("plutôt","plus tôt","« plus tôt » ≠ « plus tard »."),
" que d’habitude. Il ",E("sans est","s’en est","« s’en aller » : s’ = se, en."),
" allé par la fenêtre, et il est ",E("peut être","peut-être","Adverbe : peut-être, avec un trait d’union."),
" déjà loin."];

/* Pièce 2 : interrogatoire */
const IT=[
["Pourquoi Madame Delorme est-elle partie si tôt ?","Pourquoi Madame Delorme est partie-t-elle si tôt ?","Pourquoi est Madame Delorme partie si tôt ?","Avec un nom, on le garde et on ajoute un pronom : « Delorme est-elle ».","nom + pronom de rappel","Au gardien"],
["Quand les voleurs sont-ils entrés ?","Quand sont les voleurs entrés ?","Quand les voleurs sont entrés-ils ?","Nom + verbe-pronom : « les voleurs sont-ils ».","nom + pronom","Au gardien"],
["À qui avez-vous parlé en dernier ?","Qui avez-vous parlé à en dernier ?","À qui vous avez parlé-vous en dernier ?","La préposition passe devant « qui » : « À qui avez-vous… ».","préposition devant","À la voisine"],
["Avec quoi a-t-il forcé la porte ?","Avec quoi il a forcé-t-il la porte ?","Avec quoi a il forcé la porte ?","a + il : on ajoute -t-.","deux voyelles","Au commissaire"],
["Dites-moi ce que vous avez vu.","Dites-moi ce que avez-vous vu.","Dites-moi qu’est-ce que vous avez vu.","Question indirecte : ordre normal, pas d’inversion.","pas d’inversion","Au témoin"],
["Auriez-vous l’obligeance de répéter ?","Avez-vous eu l’obligeance de répéter ?","Auriez vous l’obligeance de répéter ?","Politesse soignée : conditionnel + inversion + trait d’union.","conditionnel","À la directrice"],
["N’avez-vous rien remarqué d’étrange ?","Ne avez-vous rien remarqué d’étrange ?","N’avez-vous pas rien remarqué d’étrange ?","« ne … rien » entoure « avez-vous ».","ne … rien autour","Au concierge"],
["🇪🇸 ¿Cuánto tiempo lleva trabajando aquí ? → Depuis combien de temps travaillez-vous ici ?","Combien de temps travaillez-vous ici depuis ?","Combien de temps avez-vous travaillé ici depuis ?","On commence par « depuis combien de temps », avec le présent.","depuis + temps","Au jardinier"]
].map(([a,b,c,w,h,cx])=>[a.replace(/^🇪🇸.*→ /,'Comment le dit-on ? 🇪🇸 ¿Cuánto tiempo lleva trabajando aquí?'),[a.replace(/^🇪🇸.*→ /,''),b,c],w,h,cx,a.replace(/^🇪🇸.*→ /,'')]);
IT[7][0]="Comment le dit-on ? 🇪🇸 ¿Cuánto tiempo lleva trabajando aquí?";
IT.forEach((x,i)=>{if(i<7)x[0]=(i==4?"Choisis la phrase correcte.":"Choisis la question correcte.")});

IT.push(
["Choisis la question correcte.",["Où le gardien a-t-il passé la nuit ?","Où a le gardien passé la nuit ?","Où le gardien a passé-t-il la nuit ?"],"Nom + auxiliaire-pronom : « le gardien a-t-il passé ».","nom + a-t-il","Au gardien","Où le gardien a-t-il passé la nuit ?"],
["Choisis la question correcte.",["Lequel de ces hommes avez-vous vu ?","Quel de ces hommes avez-vous vu ?","Lequel de ces hommes vous avez-vous vu ?"],"« Lequel » (pronom) devant « de ces hommes » ; « quel » s’accorde avec un nom.","lequel ou quel","Au témoin","Lequel de ces hommes avez-vous vu ?"],
["Choisis la question correcte.",["Qu’a-t-il dit en partant ?","Que a-t-il dit en partant ?","Qu’il a dit en partant ?"],"« Que » s’élide devant une voyelle : qu’a-t-il.","élision","Au voisin","Qu’a-t-il dit en partant ?"],
["Choisis la question correcte.",["Se souvient-elle de ce qui s’est passé ?","Elle se souvient-elle de ce qui s’est passé ?","Souvient-elle se de ce qui s’est passé ?"],"Le pronom réfléchi reste devant le verbe : « se souvient-elle ».","se + verbe","À la directrice","Se souvient-elle de ce qui s’est passé ?"]);
/* Pièce 3 : laboratoire */
const SO=[["femme",["fam","fèm","feum"],"Femme se dit « fam » : le e se prononce « a »."],["monsieur",["meu-sieu","mon-sieur","mo-sieur"],"Monsieur = « meu-sieu » : ni « on », ni « r »."],["août",["ou","a-oût","a-out"],"Août = « ou »."],["oignon",["o-gnon","oi-gnon","oua-gnon"],"Oignon = « o-gnon » : « oi » se dit « o » ici."],["sept",["sèt","sept-e","sè"],"Sept = « sèt » : le p est muet."],["second",["se-gon","sé-kon","sé-con-d"],"Second = « se-gon » : le c se dit « g »."],["fils",["fiss","fil","fi"],"Fils = « fiss » : le l est muet, le s se dit."],["poêle",["poual","pol","poèl"],"Poêle = « poual »."]]
.map(([m,o,w])=>["Comment se prononce « "+m+" » ?",o,w,"c’est une exception célèbre","Écoute pour vérifier",m]);
SO.push(["Dans « ils parlent », la terminaison -ent se dit…",["rien (elle est muette)","« an »","« ent »"],"Verbes : -ent muet. Adverbes (souvent) : « an ».","verbe ≠ adverbe","Orthographe et son",null],["Dans « question », le groupe « ti » se dit…",["« ti » (comme dans « tire »)","« si » (comme dans « nation »)","« chi »"],"Après un s : « ti » reste « ti » (kès-tion). Dans « nation » : « si ».","après s","Piège classique","question"]);

SO.push(
["Comment se prononce « sceptique » ?",["sèp-tik","skèp-tik","sep-tik"],"Sceptique = « sèp-tik » : le c est muet.","un c muet","Mot savant","sceptique"],
["Comment se prononce « asthme » ?",["asm","as-tme","as-teum"],"Asthme = « asm » : le th disparaît.","th muet","Mot savant","asthme"],
["Comment se prononce « plomb » ?",["plon","plom-b","plomp"],"Plomb = « plon » : le b est muet.","b muet","Piège","plomb"],
["Comment se prononce « paon » ?",["pan","pa-on","pa-onne"],"Paon = « pan ».","a + o","Piège","paon"],
["Comment se prononce « faisons » ?",["feu-zon","fè-zon","fai-son"],"Faisons = « feu-zon » : « ai » se dit « e » ici.","exception du verbe faire","Piège","faisons"],
["Comment se prononce « écureuil » ?",["é-ku-reuy","é-cu-reuil","é-ku-ré-ouil"],"Écureuil = « é-ku-reuy » : « euil » se dit « euy ».","euil","Piège","écureuil"]);
/* Pièce 4 : messagerie */
const VO=[["Demande poliment au commissaire s’il a pu interroger le jardinier.","Avez-vous pu interroger le jardinier ?","inversion polie"],["Dis que tu te demandes pourquoi le gardien n’a rien entendu.","Je me demande pourquoi le gardien n’a rien entendu.","question indirecte, sans inversion"],["Épelle « Delorme », puis demande où il habite.","D-E-L-O-R-M-E. Où habite-t-il ?","épeler + -t-"]];

/* Pièce 5 : verdict */
const TX="Le coupable est le jardinier. Il a décidé [a] voler le tableau, car il avait besoin [b] argent. [c] qui m’a mis la puce à l’oreille, c’est [d] comportement : il ne cessait [e] regarder sa montre. Comment [f] pu entrer sans être vu ? [g] la fenêtre, tout simplement. Interrogé, il s’est mis [i] trembler, puis il a évité [j] répondre. Il a fini [h] avouer.";
const CL={a:["de",["—","à","de","pour"]],b:["d’",["de","d’","à","—"]],c:["Ce",["Ce","Se","Ceux"]],d:["son",["son","sont","sons"]],e:["de",["à","de","—","par"]],f:["a-t-il",["a-t-il","a t il","a-il","a il"]],g:["Par",["Par","Pour","Dans","Sur"]],h:["par",["à","de","par","—"]],i:["à",["à","de","—","par"]],j:["de",["à","de","—","par"]]};
const ROOMS=[
{n:"Archives : les questions inversées",st:"Avant d’interroger qui que ce soit, le commissaire te donne accès aux archives. Ici, tu manipules la mécanique de l’inversion : tu choisis, la page construit. Puis un défi pour tester ta compréhension.",f:-1},
{n:"Archives : verbes + à / de / par / rien",st:"Deuxième dossier : le rappel que tout enquêteur doit maîtriser. Comprends la logique de chaque petit mot, puis passe l’examen.",f:-1},
{n:"Le bureau du gardien",st:"Le tableau de Madame Delorme a disparu. Le gardien a laissé une note écrite à la hâte. Elle est truffée de fautes, et la vérité se cache derrière.",f:0},
{n:"L’interrogatoire",st:"Plusieurs suspects, une seule nuit. Tu dois poser les bonnes questions, sans te tromper de forme : le commissaire t’observe.",f:1},
{n:"Le laboratoire des sons",st:"Un enregistrement a été retrouvé. Pour le comprendre, il faut maîtriser les mots dont la prononciation ne ressemble pas à l’écriture, y compris les plus vicieux.",f:2},
{n:"Le face-à-face",st:"Fini de lire à voix haute comme à l’école. Ici, tu parles pour de vrai : tu traduis, tu improvises, tu répètes de mémoire. Enregistre-toi : le commissaire te réécoutera.",f:3},
{n:"Le verdict",st:"Tu as toutes les preuves. Rédige l’accusation finale. Une erreur de détail, et l’avocat de la défense s’en servira.",f:4}];

/* Moteur QCM : 2 essais, indice, réponse */
function mc(el,it,end){let i=0,sc=0;const n=it.length,go=()=>{if(i>=n)return end(sc,n);
const[q,o,w,h,cx,au]=it[i];let t=0;const op=sh(o.map((x,k)=>[x,k]));
el.innerHTML=`<div class="dots">${it.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>${cx?`<span class="cx">${cx}</span>`:''}<p class="qq">${q}</p><div class="row o"></div><p class="fb"></p>`;
const fb=el.querySelector('.fb'),bs=[];
const fin=m=>{bs.forEach(b=>{b.disabled=true;if(b.k==0)b.classList.add('good')});fb.innerHTML=m+' '+w+(au?' <button class="a2">🔊 Écouter</button>':'')+'<br><button class="p nx">Suite →</button>';if(au)fb.querySelector('.a2').onclick=()=>spk(au,.8);fb.querySelector('.nx').onclick=()=>{i++;go()}};
op.forEach(([x,k])=>{const b=document.createElement('button');b.textContent=x;b.k=k;b.onclick=()=>{if(k==0){const p=t?1:2;sc+=p;add(p);fin(`<span class="ok">${pr()} +${p}</span>`)}else{if(!t)miss.push([q.replace(/<[^>]+>/g,''),o[0],w]);t++;b.disabled=true;if(t==1)fb.innerHTML=`<span class="ko">Non.</span> Indice : ${h}. Un dernier essai.`;else fin(`<span class="ko">La bonne réponse :</span> ${o[0]}.`)}};bs.push(b);el.querySelector('.o').append(b)})};go()}

/* Écrans */
const V=$('#v');
const steps=()=>`<div class="steps">${ROOMS.map((r,k)=>`<button class="${ok[k]?'ok':k==cur?'on':''}" onclick="room(${k})" title="${r.n}" aria-label="Aller à : ${r.n}">${k+1}</button>`).join('')}</div>`;
function intro(){V.innerHTML=`<h1>L’Affaire Delorme</h1><div class="card story">Madame Delorme, collectionneuse d’art, a retrouvé son salon vide. Le tableau a disparu pendant la nuit. Tu es l’enquêteur. Pour avancer, tu consultes les archives (questions inversées, verbes + à / de / par / rien), tu lis entre les lignes, tu interroges, tu décodes les sons, tu parles pour de vrai et tu rédiges l’accusation.</div><p class="mut">7 pièces, chacune avec une énigme différente. Tu gagnes des <b>preuves</b> en réussissant. Tu as 2 essais par question. Chaque pièce a une <b>fiche de rappel</b> (−1 preuve) si tu veux un coup de pouce. Ici, on ne revoit pas les bases : tu connais le français, on travaille la précision. <b>Rien n’est verrouillé</b> : tu peux passer une épreuve, sortir, ou aller directement où tu veux.</p><button class="p" id="st">Entrer dans le manoir</button><h2>Ou va où tu veux</h2><div class="row o">${ROOMS.map((r,k)=>`<button onclick="room(${k})">${k+1}. ${r.n}</button>`).join('')}<button onclick="dossier()">Voir le dossier final</button></div>`;$('#st').onclick=()=>room(0)}

function ra(el,fin){el.innerHTML=`<div class="card"><b>Trois façons, une seule question</b>${tb(['Oral','Courant','Inversion'],[['Tu as faim ?','Est-ce que tu as faim ?','<b>As-tu faim ?</b>'],['Il part quand ?','Quand est-ce qu’il part ?','<b>Quand part-il ?</b>']])}<p>L’inversion se trouve à l’écrit, dans les situations formelles et dans les interrogatoires. À toi de la construire sans hésiter.</p></div>
